<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaus Michael Strassner</title>
<meta name="description" content="Klaus Michael Strassner — Software Engineer at Cherry, business informatics and computer engineering student, retired Overwatch esports athlete. Vienna, Austria.">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Manrope, variable. One file carries every weight from 200 to 800,
     so the whole site needs exactly one typeface and one request. */
  @font-face {
    font-family: "Manrope";
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(/fonts/manrope-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Manrope";
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(/fonts/manrope-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    color-scheme: light;

    --ink: #000;
    --muted: #6b6b6b;
    --gap: 1.25rem;

    /* One typeface. Scale and weight carry the hierarchy. */
    --size-1: 0.875rem;
    --size-2: 1rem;
    --size-3: 1.2rem;
    --size-4: 1.44rem;
    --size-5: clamp(1.5rem, 4.5vw, 2.25rem);
  }

  html {
    background: #fff;
    color: var(--ink);
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: start;
    justify-content: center;
    padding: clamp(3rem, 10vh, 7rem) clamp(1.5rem, 6vw, 4rem) clamp(1.5rem, 6vw, 4rem);
    box-sizing: border-box;
    font-family: "Manrope", system-ui, sans-serif;
    line-height: 1.5;
  }

  .card {
    text-align: center;
    text-wrap: balance;
  }

  h1 {
    margin: 0;
    font-size: var(--size-5);
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.015em;
  }

  .roles {
    margin: clamp(1rem, 3vw, 1.5rem) 0 0;
    font-size: var(--size-2);
    line-height: 1.7;
  }

  .address {
    margin: var(--gap) 0 0;
    font-size: var(--size-2);
    color: var(--muted);
  }

  .contact {
    margin: var(--gap) 0 0;
    font-size: var(--size-2);
    line-height: 1.7;
  }

  .links {
    margin: var(--gap) 0 0;
    font-size: var(--size-1);
    color: var(--muted);
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
    text-decoration-color: #bbb;
    transition: text-decoration-color 0.15s ease;
  }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .sep { padding: 0 0.4em; color: #c4c4c4; }
</style>
</head>
<body>

<main class="card">
  <h1>Klaus Michael Strassner</h1>

  <p class="roles">
    Software Engineer @ <a href="https://www.cherry.de">Cherry</a><br>
    Business Informatics &amp; Computer Engineering Student<br>
    Retired Esports-Athlete in Overwatch
  </p>

  <p class="address">1020 Vienna, Austria</p>

  <p class="contact">
    <a href="mailto:contact@klausstrassner.com">contact@klausstrassner.com</a>
  </p>

  <p class="links">
    <a href="https://www.linkedin.com/in/klaus-strassner">LinkedIn</a><span class="sep">·</span><a href="https://github.com/klaus-strassner">GitHub</a><span class="sep">·</span><a href="https://liquipedia.net/overwatch/Zydra">Liquipedia</a>
  </p>
</main>

</body>
</html>
