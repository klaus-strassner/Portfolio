<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaus Michael Strassner</title>
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Manrope, variable. One file carries every weight from 200 to 800,
     so the whole site needs exactly one typeface and one request. */
  @font-face {
    font-family: "Manrope";
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(/fonts/manrope-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Manrope";
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(/fonts/manrope-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    color-scheme: light;

    /* One typeface. Scale carries the hierarchy. Fourth-based ratio. */
    --size-1: 0.875rem;
    --size-2: 1rem;
    --size-3: 1.333rem;
    --size-4: clamp(1.5rem, 3vw, 2.369rem);
    --size-5: clamp(2rem, 7vw, 4.209rem);
  }

  html {
    background: #fff;
    color: #000;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: start;
    justify-content: center;
    padding: clamp(3rem, 10vh, 7rem) clamp(1.5rem, 6vw, 4rem) clamp(1.5rem, 6vw, 4rem);
    box-sizing: border-box;
    font-family: "Manrope", system-ui, sans-serif;
  }

  h1 {
    margin: 0;
    font-size: var(--size-5);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-align: center;
    text-wrap: balance;
  }
</style>
</head>
<body>
<h1>Klaus Michael Strassner</h1>
</body>
</html>
